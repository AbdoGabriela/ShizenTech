{% extends "base.html" %}
{% block conteudo %}
<div class="palco">
  <div class="painel">
    <section class="centro">
      <img class="banner" src="{{ url_for('static', filename='img/jardim.png') }}" alt="Jardim zen com lago, ponte e cerejeiras">
      <h1>{{ faixa.titulo }}</h1>
      <p class="nota">{{ total }} <small>de 60 pontos</small></p>
      <p>{{ faixa.texto }}</p>
      <div class="botoes">
        <a class="botao" href="{{ url_for('resultados') }}">Ver o jardim de todos</a>
        <a class="botao sec" href="{{ url_for('index') }}">Responder de novo</a>
      </div>
      {% include "_aviso.html" %}
    </section>
  </div>
</div>
{% endblock %}
