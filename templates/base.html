<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Termômetro do Momento · Shizen Tech</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Nunito+Sans:wght@400;700&display=swap" rel="stylesheet">
  <link rel="icon" href="{{ url_for('static', filename='img/logo.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/estilo.css') }}">
  <script>document.documentElement.classList.add("js")</script>
</head>
<body>
  <nav>
    <a class="marca" href="{{ url_for('index') }}">
      <img src="{{ url_for('static', filename='img/logo.png') }}" alt="" height="40">
      Shizen Tech
    </a>
    <div class="nav-links">
      <a href="{{ url_for('resultados') }}">Jardim de todos</a>
      <a href="{{ url_for('resultados') }}#links-importantes">Links importantes</a>
    </div>
  </nav>
  <main>{% block conteudo %}{% endblock %}</main>
  <audio id="musica" src="{{ url_for('static', filename='audio/musica.mp3') }}" loop preload="auto"></audio>
  <div class="player" role="group" aria-label="Controle da música">
    <button id="mus-play" type="button" aria-label="Tocar ou pausar" title="Tocar / pausar">▶</button>
    <button id="mus-reiniciar" type="button" aria-label="Recomeçar a música" title="Recomeçar">↺</button>
    <span class="player-vol" aria-hidden="true">♪</span>
    <input id="mus-volume" type="range" min="0" max="1" step="0.05" value="0.3" aria-label="Volume">
  </div>
  <script src="{{ url_for('static', filename='js/slides.js') }}"></script>
  <script src="{{ url_for('static', filename='js/musica.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
